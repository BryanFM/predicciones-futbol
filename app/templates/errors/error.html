{% extends "base.html" %}

{% block title %}{{ status_code }} — {{ title }} | Hamster Fijas{% endblock %}

{% block content %}
<section class="error-page">
  <img data-src="/static/hamster.png" alt="" class="error-page-img" width="100" height="100">
  <p class="error-page-code" aria-hidden="true">{{ status_code }}</p>
  <h1 class="error-page-title">{{ title }}</h1>
  <p class="error-page-message">{{ error_detail }}</p>
  <div class="error-page-actions">
    <a href="/" class="btn btn-primary">Volver a partidos</a>
    {% if status_code == 500 %}
    <button type="button" class="btn btn-outline" onclick="window.location.reload()">Reintentar</button>
    {% endif %}
  </div>
</section>
{% endblock %}
