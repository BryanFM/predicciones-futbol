services:
  - type: web
    name: predicciones-futbol
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: predicciones-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: predicciones-db
    databaseName: predicciones
    user: predicciones
    plan: free
