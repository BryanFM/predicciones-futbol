# Blueprint Render — https://render.com/docs/blueprint-spec
# Repo: https://github.com/BryanFM/predicciones-futbol
# Producción: https://hamsterfijas.com

services:
  - type: web
    name: predicciones-futbol
    runtime: python
    branch: master
    buildCommand: python -m pip install --upgrade pip && pip install --default-timeout=120 --retries=5 -r requirements.txt
    preDeployCommand: python scripts/render-predeploy.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: predicciones-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: HTTPS_ONLY
        value: "true"
      - key: ENFORCE_UNIQUE_PHONE
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        value: bryan.flores.magallanes@gmail.com,maxtorres4444@gmail.com
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: GA_MEASUREMENT_ID
        value: G-W394R9W8E7
      - key: CLARITY_PROJECT_ID
        value: x51o85xggi
      - key: SITE_URL
        value: https://hamsterfijas.com
      - key: YAPE_PAYMENTS_ENABLED
        value: "true"
      - key: YAPE_RECIPIENT_PHONE
        value: "944717071"

databases:
  - name: predicciones-db
    databaseName: predicciones
    user: predicciones
    plan: free
