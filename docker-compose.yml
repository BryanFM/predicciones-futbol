# PostgreSQL local — replica el stack de Render (predicciones-db)
# Uso:  docker compose up -d
# Luego en .env:  DATABASE_URL=postgresql://predicciones:predicciones@localhost:5432/predicciones

services:
  db:
    image: postgres:16-alpine
    container_name: predicciones-futbol-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: predicciones
      POSTGRES_PASSWORD: predicciones
      POSTGRES_DB: predicciones
    volumes:
      - predicciones_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predicciones -d predicciones"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  predicciones_pg_data:
